<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS 車資計算</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: #aaa;
    }
    .card {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .label {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 6px;
    }
    .value {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 22px;
    }
    .value.fare {
      color: #30d158;
      font-size: 3.2rem;
    }
    .value.km {
      color: #0a84ff;
    }
    .status {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 28px;
      min-height: 1.2em;
    }
    .status.active {
      color: #30d158;
    }
    .status.error {
      color: #ff453a;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      font-size: 1.35rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-start {
      background: #30d158;
      color: #000;
    }
    .btn-stop {
      background: #ff453a;
      color: #fff;
    }
    .btn-reset {
      background: #2c2c2e;
      color: #fff;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>GPS 車資計算</h1>

  <div class="card">
    <div class="label">目前距離</div>
    <div class="value km" id="distance">0.00 <span style="font-size:1.2rem">km</span></div>

    <div class="label">預估車資</div>
    <div class="value fare" id="fare">100 <span style="font-size:1.3rem">元</span></div>

    <div class="status" id="status">準備就緒</div>

    <button class="btn btn-start" id="mainBtn" onclick="toggleTracking()">開始計費</button>
    <button class="btn btn-reset" id="resetBtn" onclick="resetAll()" style="display:none;">重新計算</button>
  </div>

  <script>
    // ========== 計費規則 ==========
    // 3km 以內：100 元
    // 3~8km：線性從 100 → 200（每公里 +20）
    // 8km 後：每公里輪流 +30、+20，無條件進位
    function calcFare(km) {
      if (km <= 3) return 100;

      // 3 ~ 8 km：從 100 線性增加到 200
      if (km <= 8) {
        // 每公里 +20，無條件進位
        const extraKm = km - 3;
        return 100 + Math.ceil(extraKm * 20);
      }

      // 超過 8 km
      // 先固定到 8km = 200 元
      let fare = 200;
      let remaining = km - 8;

      // 從第 9 公里開始，奇數公里 +30，偶數公里 +20
      // 第1個額外公里 (8~9)：+30
      // 第2個 (9~10)：+20
      // 第3個 (10~11)：+30 ...
      let fullKm = Math.floor(remaining);
      let fraction = remaining - fullKm;

      for (let i = 1; i <= fullKm; i++) {
        if (i % 2 === 1) {
          fare += 30; // 奇數：+30
        } else {
          fare += 20; // 偶數：+20
        }
      }

      // 不足1公里的部分，無條件進位（依下一檔費率）
      if (fraction > 0) {
        const nextIsOdd = (fullKm + 1) % 2 === 1;
        fare += nextIsOdd ? 30 : 20;
      }

      return fare;
    }

    // ========== 狀態 ==========
    let watching = false;
    let watchId = null;
    let totalDistance = 0;      // 公尺
    let lastLat = null;
    let lastLon = null;
    let lastTime = null;

    // ========== 工具函式 ==========
    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    // Haversine 計算兩點距離（公尺）
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // 地球半徑（公尺）
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function updateUI() {
      const km = totalDistance / 1000;
      document.getElementById('distance').innerHTML =
        km.toFixed(2) + ' <span style="font-size:1.2rem">km</span>';
      document.getElementById('fare').innerHTML =
        calcFare(km) + ' <span style="font-size:1.3rem">元</span>';
    }

    function setStatus(text, type = '') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + type;
    }

    // ========== GPS 追蹤 ==========
    function onPosition(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy; // 公尺

      // 精度太差就忽略（超過 50 公尺）
      if (accuracy > 50) {
        setStatus('GPS 精度不足 (' + Math.round(accuracy) + 'm)，等待中...', 'error');
        return;
      }

      if (lastLat !== null && lastLon !== null) {
        const dist = getDistance(lastLat, lastLon, lat, lon);

        // 過濾太小的移動（雜訊），至少移動 5 公尺才累加
        if (dist >= 5) {
          totalDistance += dist;
          updateUI();
        }
      }

      lastLat = lat;
      lastLon = lon;
      lastTime = Date.now();

      setStatus('追蹤中… 精度 ' + Math.round(accuracy) + 'm', 'active');
    }

    function onError(err) {
      let msg = 'GPS 錯誤';
      if (err.code === 1) msg = '請允許位置權限';
      else if (err.code === 2) msg = '無法取得位置';
      else if (err.code === 3) msg = '定位逾時';
      setStatus(msg, 'error');
    }

    function startTracking() {
      if (!navigator.geolocation) {
        setStatus('此裝置不支援 GPS', 'error');
        return;
      }

      totalDistance = 0;
      lastLat = null;
      lastLon = null;
      updateUI();

      watchId = navigator.geolocation.watchPosition(
        onPosition,
        onError,
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );

      watching = true;
      document.getElementById('mainBtn').textContent = '停止計費';
      document.getElementById('mainBtn').className = 'btn btn-stop';
      document.getElementById('resetBtn').style.display = 'none';
      setStatus('正在定位…', 'active');
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      watching = false;
      document.getElementById('mainBtn').textContent = '開始計費';
      document.getElementById('mainBtn').className = 'btn btn-start';
      document.getElementById('resetBtn').style.display = 'block';
      setStatus('已停止');
    }

    function toggleTracking() {
      if (watching) {
        stopTracking();
      } else {
        startTracking();
      }
    }

    function resetAll() {
      totalDistance = 0;
      lastLat = null;
      lastLon = null;
      updateUI();
      document.getElementById('resetBtn').style.display = 'none';
      setStatus('準備就緒');
    }

    // 防止螢幕休眠（部分瀏覽器支援）
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
